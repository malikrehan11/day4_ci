name: React CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        # 👈 Points directly to the package-lock.json inside your subfolder
        cache-dependency-path: './ci_demo/package-lock.json' 

    - name: Install Dependencies
      run: |
        cd ci_demo
        npm install

    - name: Build React Application
      run: |
        cd ci_demo
        npm run build

    # --- BELOW STEPS ARE DOCKER & EC2 ENHANCEMENTS SEEN IN YOUR WORKFLOW LOGS ---
    # (Ensure you have your GitHub Secrets set up in your repository settings if using these)

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image
      run: |
        cd ci_demo
        docker build -t ${{ secrets.DOCKER_USERNAME }}/react-app:latest .

    - name: Push Docker Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/react-app:latest

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/react-app:latest
          docker stop react-container || true
          docker rm react-container || true
          docker run -d --name react-container -p 80:80 ${{ secrets.DOCKER_USERNAME }}/react-app:latest
